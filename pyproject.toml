[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pix-concilia"
version = "1.0.0"
description = "Concilia Pix recebido contra o que foi vendido. Offline, sem dependencia, sem cadastro."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["pix", "conciliacao", "financeiro", "brasil", "csv", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.scripts]
pix-concilia = "pix_concilia.cli:main"

[tool.setuptools.packages.find]
include = ["pix_concilia*"]
